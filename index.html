<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheems | Terminal Home</title>
    <style>
        :root {
            --green: #00ff41;
            --bg: #0d0d0d;
        }
        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        #terminal-text {
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: var(--green);
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        nav {
            margin-top: 30px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        nav a {
            color: var(--green);
            text-decoration: none;
            border: 1px solid var(--green);
            padding: 5px 15px;
            margin-right: 10px;
            display: inline-block;
            transition: all 0.3s;
        }
        nav a:hover {
            background: var(--green);
            color: var(--bg);
            box-shadow: 0 0 15px var(--green);
        }
        .command { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div id="terminal-text"></div><span class="cursor"></span>

    <nav id="nav-links" style="display: none;">
        <a href="https://your-blog-url.vercel.app">进入博客 [BLOG]</a>
        <a href="https://github.com/luzhuya">GitHub</a>
        <a href="https://twitter.com/DonNotLeo">Twitter</a>
    </nav>
</div>

<script>
    const text = `> Initializing system...
> Connection established.
> User: Cheems
> Status: Running 
> "生活原本沉闷，但跑起来就有风！"

[Self-Introduction]
我是 Cheems，一名极客。
目前正沉迷于 OpenWrt 自动化、Tailscale 组网以及静态博客架构。

> 命令: list --all-links`;

    let i = 0;
    const speed = 50; // 打字速度（毫秒）

    function typeWriter() {
        if (i < text.length) {
            document.getElementById("terminal-text").innerHTML += text.charAt(i);
            i++;
            setTimeout(typeWriter, speed);
        } else {
            // 打字结束后显示导航栏
            document.getElementById("nav-links").style.display = "block";
        }
    }

    window.onload = typeWriter;
</script>

</body>
</html>
